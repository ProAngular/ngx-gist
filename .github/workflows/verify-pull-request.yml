name: 'Verify Pull Request'
on: pull_request
jobs:
  verify_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Checkout 🛎️
        run: npm ci

      - name: Verify Code 👌
        run: |
          npm run lint
          npm run prettier:check
          npm test -- --watch=false

      - name: Build 🔧
        run: |
          npm run build:prod
          npm run npm-build-package
